let fundoX = 0; // quanto o plano de fundo já andou
const chao = 396; // altura (y) da grama, onde as coisas "batem" no chão
let tempo = 0;    // relógio da animação (sobe sem parar)
let andando = false; // o garoto está andando agora?
let direcao = 0;  // -1 = esquerda, 1 = direita, 0 = parado
let ultimoX = 0;  // onde o garoto estava no quadro anterior
let pulinho = 0;  // pulinho de alegria ao pegar uma caixa (1 até 0)
let flash = 0; // quando vale mais que 0, a tela pisca de vermelho (levou bomba!)

// Um objeto agrupa as informações do jogador (o garoto)
const jogador = { x: 150, y: 302, largura: 60, altura: 94, velocidade: 8 };

// Uma lista (array) guarda tudo o que está caindo (caixas e bombas)
let caixas = [];

// Guarda quais teclas estão apertadas agora
const teclas = {};
document.addEventListener("keydown", e => {
  teclas[e.key] = true;
  if (e.key.startsWith("Arrow")) e.preventDefault(); // impede a página de rolar com as setas
});
document.addEventListener("keyup",   e => teclas[e.key] = false);

// Controle pelo dedo/mouse: o garoto vai até onde você tocar
tela.addEventListener("pointermove", e => {
  const area = tela.getBoundingClientRect();
  const escala = tela.width / area.width;
  jogador.x = (e.clientX - area.left) * escala - jogador.largura / 2;
});

// ========== 2. CRIAR CAIXAS E BOMBAS ==========
function criarItem() {
  // Sorteia: 30% de chance de ser bomba, o resto é caixa
  const ehBomba = Math.random() < 0.3;
  const largura = ehBomba ? 30 : 36;
  const altura  = ehBomba ? 70 : 36;

  caixas.push({
    tipo: ehBomba ? "bomba" : "caixa",
    x: Math.random() * (tela.width - largura), // posição horizontal sorteada
    y: -altura,                                // começa acima da tela
    largura: largura,
    altura: altura,
    velocidade: 3 + Math.random() * 2 + pontos * 0.01 // fica mais rápido com os pontos
  });
}
// A cada 0,8 segundo (800 ms), cria um item novo
setInterval(() => { if (!fimDeJogo) criarItem(); }, 800);

// ========== 3. ATUALIZAR (a lógica do jogo) ==========
function atualizar() {
  // Mover o garoto
  // Setas do teclado (ou as letras A e D)
  if (teclas["ArrowLeft"]  || teclas["a"] || teclas["A"]) jogador.x -= jogador.velocidade;
  if (teclas["ArrowRight"] || teclas["d"] || teclas["D"]) jogador.x += jogador.velocidade;

  // Não deixar o garoto sair da tela
  jogador.x = Math.max(0, Math.min(tela.width - jogador.largura, jogador.x));

  // Animação: descobre se o garoto andou e para qual lado
  const passo = jogador.x - ultimoX;
  andando = Math.abs(passo) > 0.5;
  direcao = andando ? Math.sign(passo) : 0;
  ultimoX = jogador.x;
  tempo += andando ? 0.4 : 0.08;          // anda: relógio rápido / parado: devagar
  pulinho = Math.max(0, pulinho - 0.05);  // o pulinho de alegria vai acabando

  fundoX += 3; // o fundo anda: parece que o garoto está correndo

  if (flash > 0) flash--; // o piscar vermelho vai diminuindo

  // Para cada item da lista...
  for (let i = caixas.length - 1; i >= 0; i--) {
    const c = caixas[i];
    c.y += c.velocidade; // ...ele desce um pouco

    // Colisão: o item encostou no garoto?
    const pegou = c.y + c.altura >= jogador.y &&
                  c.y <= jogador.y + jogador.altura &&
                  c.x + c.largura >= jogador.x &&
                  c.x <= jogador.x + jogador.largura;

    if (pegou) {
      if (c.tipo === "caixa") {
        pontos += 10;  // caixa: ganha 10 pontos
        pulinho = 1;   // e dá um pulinho de alegria!
      } else {
        vidas--;       // bomba: perde 1 vida!
        flash = 15;
        if (vidas <= 0) fimDeJogo = true;
      }
      caixas.splice(i, 1); // remove o item da lista
    } else if (c.y + c.altura > chao) {
      // O item caiu no chão
      if (c.tipo === "caixa") {   // deixar uma caixa cair custa uma vida
        vidas--;
        if (vidas <= 0) fimDeJogo = true;
      }                           // bomba no chão? Ótimo, nada acontece
      caixas.splice(i, 1);
    }
  }
}

// ========== 4. DESENHAR ==========
// Desenha o personagem usando só formas (círculos, linhas e retângulos).
// O ponto (0, 0) são os PÉS dele: para cima os valores de y ficam negativos.
function desenharPersonagem() {
  pincel.scale(0.85, 0.85);
  pincel.lineCap = "round";

  // "balanco" vai de -1 até 1 e volta, de acordo com o relógio (tempo).
  // É ele que faz pernas e braços irem para frente e para trás.
  const balanco = andando ? Math.sin(tempo) : 0;

  // Duas pernas: lado = -1 (esquerda) ou 1 (direita)
  for (const lado of [-1, 1]) {
    const angulo = balanco * 0.7 * lado;              // quanto a perna está inclinada
    const quadrilX = lado * 9, quadrilY = -30;        // onde a perna começa
    const peX = quadrilX + Math.sin(angulo) * 28;     // onde o pé termina
    let   peY = quadrilY + Math.cos(angulo) * 28;
    if (andando) peY -= Math.max(0, Math.cos(tempo) * lado) * 6; // levanta o pé ao dar o passo

    pincel.strokeStyle = "#3b4cca";                   // calça azul
    pincel.lineWidth = 10;
    pincel.beginPath(); pincel.moveTo(quadrilX, quadrilY); pincel.lineTo(peX, peY); pincel.stroke();

    pincel.fillStyle = "#5b2a12";                     // tênis marrom
    pincel.beginPath(); pincel.ellipse(peX + direcao * 3, peY + 1, 10, 5, 0, 0, Math.PI * 2); pincel.fill();
  }

  // Corpo (camiseta amarela)
  pincel.fillStyle = "#ffcf33";
  pincel.beginPath(); pincel.roundRect(-17, -70, 34, 42, 10); pincel.fill();

  // Dois braços: balançam no sentido contrário das pernas
  for (const lado of [-1, 1]) {
    const ombroX = lado * 18, ombroY = -62;
    // se acabou de pegar uma caixa (pulinho), levanta os braços!
    const angulo = pulinho > 0 ? Math.PI - lado * 0.5 : -balanco * 0.8 * lado;
    const maoX = ombroX + Math.sin(angulo) * 24, maoY = ombroY + Math.cos(angulo) * 24;

    pincel.strokeStyle = "#f6c9a0";
    pincel.lineWidth = 8;
    pincel.beginPath(); pincel.moveTo(ombroX, ombroY); pincel.lineTo(maoX, maoY); pincel.stroke();
    pincel.fillStyle = "#f6c9a0";
    pincel.beginPath(); pincel.arc(maoX, maoY, 5.5, 0, Math.PI * 2); pincel.fill();
  }

  // Cabeça
  pincel.fillStyle = "#f6c9a0";
  pincel.beginPath(); pincel.arc(0, -86, 19, 0, Math.PI * 2); pincel.fill();

  // Boné vermelho: a aba aponta para o lado em que ele anda
  pincel.fillStyle = "#e63946";
  pincel.beginPath(); pincel.arc(0, -90, 19, Math.PI, 0); pincel.fill();
  pincel.beginPath(); pincel.ellipse((direcao || 1) * 12, -90, 14, 4, 0, 0, Math.PI * 2); pincel.fill();

  // Olhos (olham para onde ele anda)
  for (const lado of [-1, 1]) {
    pincel.fillStyle = "#fff";
    pincel.beginPath(); pincel.arc(lado * 7 + direcao * 2, -85, 5, 0, Math.PI * 2); pincel.fill();
    pincel.fillStyle = "#111";
    pincel.beginPath(); pincel.arc(lado * 7 + direcao * 3.5, -85, 2.5, 0, Math.PI * 2); pincel.fill();
  }

  // Bochechas e um sorrisão de brincalhão, com língua!
  pincel.fillStyle = "rgba(255, 90, 120, 0.55)";
  pincel.beginPath(); pincel.arc(-13, -78, 3.5, 0, Math.PI * 2); pincel.arc(13, -78, 3.5, 0, Math.PI * 2); pincel.fill();
  pincel.fillStyle = "#7a1f2b";
  pincel.beginPath(); pincel.arc(0, -81, 9, 0, Math.PI); pincel.fill();
  pincel.fillStyle = "#ff7b9c";
  pincel.beginPath(); pincel.ellipse(0, -75, 4.5, 3, 0, 0, Math.PI * 2); pincel.fill();
}

function desenhar() {
  // Plano de fundo em movimento: a figura é desenhada duas vezes, lado a lado.
  // Quando uma sai pela esquerda, a outra já está entrando (efeito de repetição).
  pincel.imageSmoothingEnabled = false; // mantém os pixels nítidos
  const larguraFundo = imgFundo.width * (tela.height / imgFundo.height);
  const posicao = -(fundoX % larguraFundo);
  pincel.drawImage(imgFundo, posicao, 0, larguraFundo, tela.height);
  pincel.drawImage(imgFundo, posicao + larguraFundo, 0, larguraFundo, tela.height);

  // Jogador animado. Usamos "translate" e "rotate" para mover e girar o desenho,
  // e "save/restore" para essa mudança valer só para o garoto.
  const pes = jogador.y + jogador.altura;              // altura do chão sob os pés
  const quique = andando ? Math.abs(Math.sin(tempo)) * 8   // andando: pula a cada passo
                         : Math.sin(tempo) * 1.5;          // parado: "respira" de leve
  const alegria = Math.sin(pulinho * Math.PI) * 22;    // pulo extra ao pegar uma caixa
  const inclinar = andando ? Math.sin(tempo) * 0.12 + direcao * 0.1 : 0; // balança e se inclina

  // sombrinha no chão (fica menor quando ele pula)
  pincel.fillStyle = "rgba(0,0,0,0.25)";
  pincel.beginPath();
  pincel.ellipse(jogador.x + jogador.largura / 2, pes, 28 - (quique + alegria) / 3, 6, 0, 0, Math.PI * 2);
  pincel.fill();

  pincel.save();
  pincel.translate(jogador.x + jogador.largura / 2, pes - Math.max(0, quique) - alegria); // vai até os pés
  pincel.rotate(inclinar);                                                                  // gira a partir dos pés
  desenharPersonagem(); // desenha o personagem (veja a função desenharPersonagem, mais acima)
  pincel.restore();

  // Caixas e bombas: escolhe a imagem de acordo com o tipo
  for (const c of caixas) {
    const figura = c.tipo === "bomba" ? imgBomba : imgCaixa;
    pincel.drawImage(figura, c.x, c.y, c.largura, c.altura);
  }

  // Piscar vermelho quando leva uma bomba
  if (flash > 0) {
    pincel.fillStyle = "rgba(255, 0, 0, " + flash / 30 + ")";
    pincel.fillRect(0, 0, tela.width, tela.height);
  }

  // Placar
  pincel.fillStyle = "#123";
  pincel.font = "18px Verdana";
  pincel.fillText("Pontos: " + pontos, 10, 25);
  pincel.fillText("Vidas: " + "❤️".repeat(Math.max(vidas, 0)), 10, 50);

  // Mensagem de fim
  if (fimDeJogo) {
    pincel.fillStyle = "rgba(0,0,0,0.7)";
    pincel.fillRect(0, 180, tela.width, 130);
    pincel.fillStyle = "#fff";
    pincel.font = "28px Verdana";
    pincel.fillText("Fim de jogo!", 115, 230);
    pincel.font = "16px Verdana";
    pincel.fillText("Pontos: " + pontos + " — aperte Enter", 100, 270);
  }
}

// ========== 5. REINICIAR ==========
function reiniciar() {
  pontos = 0; vidas = 3; caixas = []; fimDeJogo = false; flash = 0; fundoX = 0;
}
document.addEventListener("keydown", e => { if (e.key === "Enter" && fimDeJogo) reiniciar(); });
tela.addEventListener("click", () => { if (fimDeJogo) reiniciar(); });

// ========== 6. LOOP DO JOGO ==========
// Repete atualizar + desenhar cerca de 60 vezes por segundo
function loop() {
  if (!fimDeJogo) atualizar();
  desenhar();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
